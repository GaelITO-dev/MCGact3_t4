<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario de libro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h2>Formulario de libro</h2>

    <form th:action="@{/libros/guardar}" th:object="${libro}" method="post">
        <input type="hidden" th:field="*{idLibro}">

        <div class="mb-3">
            <label for="titulo" class="form-label">Título</label>
            <input id="titulo" type="text" th:field="*{titulo}" class="form-control" maxlength="255" required>
        </div>

        <div class="mb-3">
            <label for="isbn" class="form-label">ISBN</label>
            <input id="isbn" type="text" th:field="*{isbn}" class="form-control" maxlength="20">
        </div>

        <div class="mb-3">
            <label for="fechaPublicacion" class="form-label">Fecha de publicación</label>
            <input id="fechaPublicacion" type="date" th:field="*{fechaPublicacion}" class="form-control">
        </div>

        <div class="mb-3">
            <label for="autorId" class="form-label">Autor</label>
            <select id="autorId" name="autorId" class="form-select" required>
                <option value="">Selecciona un autor</option>
                <option th:each="autor : ${autores}"
                        th:value="${autor.idAutor}"
                        th:text="${autor.nombre + ' ' + autor.apellido}"
                        th:selected="${libro.autor != null and libro.autor.idAutor == autor.idAutor}"></option>
            </select>
        </div>

        <button type="submit" class="btn btn-success">Guardar</button>
        <a th:href="@{/libros}" class="btn btn-secondary">Cancelar</a>
    </form>
</body>
</html>
