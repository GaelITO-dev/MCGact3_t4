<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Libros</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h2>Lista de Libros</h2>

    <a th:href="@{/libros/nuevo}" class="btn btn-primary mb-3">Nuevo libro</a>
    <a th:href="@{/}" class="btn btn-secondary mb-3">Volver a autores</a>

    <table class="table table-bordered">
        <thead>
            <tr>
                <th>ID</th>
                <th>Título</th>
                <th>ISBN</th>
                <th>Fecha de publicación</th>
                <th>Autor</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="libro : ${libros}">
                <td th:text="${libro.idLibro}"></td>
                <td th:text="${libro.titulo}"></td>
                <td th:text="${libro.isbn}"></td>
                <td th:text="${libro.fechaPublicacion}"></td>
                <td th:text="${libro.autor.nombre + ' ' + libro.autor.apellido}"></td>
                <td>
                    <a th:href="@{/libros/editar/{id}(id=${libro.idLibro})}" class="btn btn-warning btn-sm">Editar</a>
                    <a th:href="@{/libros/eliminar/{id}(id=${libro.idLibro})}" class="btn btn-danger btn-sm">Eliminar</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(libros)}">
                <td colspan="6">No hay libros registrados.</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
