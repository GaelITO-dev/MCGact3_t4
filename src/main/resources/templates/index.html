<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Autores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2>Lista de Autores</h2>

<a href="/nuevo" class="btn btn-primary mb-3">Nuevo Autor</a>
<a th:href="@{/libros}" class="btn btn-outline-primary mb-3">Administrar libros</a>

<table class="table table-bordered">
    <thead>
        <tr>
            <th>Libros</th>
            <th>ID</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Nacionalidad</th>
            <th>Fecha de Nacimiento</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="a : ${autores}">
            <td>
                <a th:href="@{/ver-libros/{id}(id=${a.idAutor})}" class="btn btn-info btn-sm">Ver sus libros</a>
            </td>
            <td th:text="${a.idAutor}"></td>
            <td th:text="${a.nombre}"></td>
            <td th:text="${a.apellido}"></td>
            <td th:text="${a.nacionalidad}"></td>
            <td th:text="${a.fechaNacimiento}"></td>
            <td>
                <a th:href="@{/editar/{id}(id=${a.idAutor})}" class="btn btn-warning btn-sm">Editar</a>
                <a th:href="@{/eliminar/{id}(id=${a.idAutor})}" class="btn btn-danger btn-sm">Eliminar</a>
            </td>
        </tr>
    </tbody>
</table>

</body>
</html>
