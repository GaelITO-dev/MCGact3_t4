<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Formulario de Autor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">

<h2>Formulario de Autor</h2>

<form th:action="@{/guardar}" th:object="${autor}" method="post">

    <!-- Campo oculto para el ID necesario al editar -->
    <input type="hidden" th:field="*{idAutor}" />

    <div class="mb-3">
        <label class="form-label">Nombre</label>
        <input type="text" th:field="*{nombre}" class="form-control" required/>
    </div>

    <div class="mb-3">
        <label class="form-label">Apellido</label>
        <input type="text" th:field="*{apellido}" class="form-control" required/>
    </div>

    <div class="mb-3">
        <label class="form-label">Nacionalidad</label>
        <input type="text" th:field="*{nacionalidad}" class="form-control"/>
    </div>

    <div class="mb-3">
        <label class="form-label">Fecha de Nacimiento</label>
        <input type="date" th:field="*{fechaNacimiento}" class="form-control"/>
    </div>

    <button type="submit" class="btn btn-success">Guardar</button>
    <a href="/" class="btn btn-secondary">Cancelar</a>

</form>

</body>
</html>
